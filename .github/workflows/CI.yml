name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    # No workflow runs in a private repository.
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - version: '1.10'
            os: macos-latest
          - version: '1.10'
            os: windows-latest
    env:
      JULIA_NUM_THREADS: 4
      ALMANAC_REQUIRE_KERNELS: 1
      # The AD groups take 11 to 19 minutes of each job, compiling the AD backends, and
      # `static` checks the source, which is the same on every job. The coverage job runs
      # all of them on Julia 1; Julia 1.10 keeps Zygote (ChainRulesCore) and the tracked
      # numbers. A tag or a manual run tests every group on every job.
      ALMANAC_TEST_EXCLUDE: >-
        ${{ !(startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        && (matrix.version == '1.10' && 'ad_enzyme ad_mooncake static'
        || 'ad_enzyme ad_mooncake ad_zygote ad_tracked static') || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Cache the test kernels
        uses: actions/cache@v4
        with:
          path: test/data
          key: kernels-${{ hashFiles('test/kernels.jl') }}
          # A cache of an older kernel list restores the files it has; the
          # download script fetches only the missing ones.
          restore-keys: kernels-
          # One archive serves every runner, so Windows does not download.
          enableCrossOsArchive: true
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
  coverage:
    # Line coverage of src/ and ext/ in one job, sent to Codecov and kept as an
    # artifact (lcov.info); the manual quotes the figure of this job. It runs every
    # group, the AD groups included.
    name: Coverage (Julia 1, ubuntu-latest)
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
      id-token: write  # Codecov authenticates the upload by OIDC, with no token
    env:
      JULIA_NUM_THREADS: 4
      ALMANAC_REQUIRE_KERNELS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Cache the test kernels
        uses: actions/cache@v4
        with:
          path: test/data
          key: kernels-${{ hashFiles('test/kernels.jl') }}
          restore-keys: kernels-
          enableCrossOsArchive: true
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: true
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext
      - name: Line coverage
        run: |
          awk -F'[:,]' '/^LH:/ {h += $2} /^LF:/ {f += $2} END {printf "lines hit %d of %d: %.1f %%\n", h, f, 100 * h / f}' lcov.info | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          disable_search: true
          use_oidc: true
          # A pull request from a fork gets no OIDC token and uploads without one;
          # a failed upload does not fail the job.
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
  ad-lower-bounds:
    # The AD extensions at the lowest versions that [compat] allows, on the oldest
    # Julia: the bounds of EnzymeCore and Mooncake are pinned exactly ("=x.y.z"), so a
    # bound that no longer works fails here. EnzymeCore 0.8.10 is also the oldest
    # version that the Enzyme extension of DifferentiationInterface 0.7 loads with.
    name: AD lower bounds (Julia 1.10, ubuntu-latest)
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: 4
      ALMANAC_REQUIRE_KERNELS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Cache the test kernels
        uses: actions/cache@v4
        with:
          path: test/data
          key: kernels-${{ hashFiles('test/kernels.jl') }}
          restore-keys: kernels-
          enableCrossOsArchive: true
      - name: Pin EnzymeCore and Mooncake to their lower bounds
        run: |
          sed -i -E 's/^(EnzymeCore|Mooncake) = "([0-9.]+)"$/\1 = "=\2"/' Project.toml test/Project.toml
          grep -E '^(EnzymeCore|Mooncake) = ' Project.toml test/Project.toml
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
          test_args: 'ad_mooncake ad_enzyme'
